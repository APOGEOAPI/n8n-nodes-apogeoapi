name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC trusted publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing (OIDC) requires npm >= 11.5.1.
      # Node 24 ships npm 11.x; upgrade defensively with a retry in case the
      # in-place self-upgrade hits the known promise-retry race.
      - name: Ensure npm >= 11.5.1
        run: |
          npm install -g npm@latest || npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN — OIDC trusted publishing. Provenance is automatic.
      - name: Publish to npm (trusted publishing)
        run: npm publish --access public
